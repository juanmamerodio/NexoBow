# NexoBow Autonomous — Topología Zero-Trust Gate 1 (100% offline hasta activar VPS)
# Regla financiera: $0 gasto fijo previo a cobrar Gate 1.
# Chatwoot queda explícitamente desacoplado fuera de este Compose para preservar RAM (ver docs/gate1-vps-activation.md).

networks:
  front-ingress:
    driver: bridge
  app-tier:
    driver: bridge
  data-tier:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  n8n_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - data-tier
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_autonomous_init.sql:/docker-entrypoint-initdb.d/001_autonomous_init.sql:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - data-tier
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-tier
      - data-tier
    ports:
      - "127.0.0.1:${N8N_LOCAL_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      META_WABA_VERIFY_TOKEN: ${META_WABA_VERIFY_TOKEN}
      META_WABA_APP_SECRET: ${META_WABA_APP_SECRET}
      META_WABA_ACCESS_TOKEN: ${META_WABA_ACCESS_TOKEN}
      NEXOBOW_INGEST_URL: ${NEXOBOW_INGEST_URL}
      AUTONOMOUS_INGEST_KEY: ${AUTONOMOUS_INGEST_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2025.2.0
    restart: unless-stopped
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - front-ingress
      - app-tier
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
