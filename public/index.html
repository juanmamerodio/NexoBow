<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexoBow System — Prospección & Web Privada</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#DB1FFF">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0813; color: #f3f0f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .accent-gradient { background: linear-gradient(135deg, #DB1FFF 0%, #7928CA 100%); }
    .glass { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12 antialiased">
  <!-- Header Mobile -->
  <header class="glass sticky top-0 z-50 px-5 py-4 flex items-center justify-between border-b border-white/10">
    <div class="flex items-center gap-2">
      <span class="text-xl">⚡</span>
      <span class="font-bold tracking-tight text-white text-lg">Nexo<span class="text-[#DB1FFF]">Bow</span> System</span>
    </div>
    <div id="authStatus" class="flex items-center gap-2">
      <button id="logoutBtn" class="text-xs text-white/50 hover:text-white px-2 py-1 rounded border border-white/10 hidden">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Login Modal / Screen -->
  <main class="flex-1 px-4 py-6 max-w-xl mx-auto w-full">
    <section id="loginSection" class="glass rounded-2xl p-6 mt-8">
      <h2 class="text-xl font-bold mb-2">Acceso Privado</h2>
      <p class="text-sm text-white/60 mb-6">Ingresá tu Token de Operador para sincronizar prospectos diarios y links de demo.</p>
      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-white/50 mb-1" for="tokenInput">Token / PIN</label>
          <input type="password" id="tokenInput" placeholder="NEXOBOW_SYSTEM_KEY" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#DB1FFF]">
        </div>
        <button id="loginBtn" class="w-full py-3.5 rounded-xl font-semibold text-white accent-gradient active:scale-[0.98] transition">Ingresar al Dashboard</button>
      </div>
    </section>

    <!-- Dashboard Content -->
    <section id="dashboardSection" class="hidden space-y-6">
      <!-- Status Card -->
      <div class="glass rounded-2xl p-5 flex items-center justify-between">
        <div>
          <p class="text-xs uppercase tracking-wider text-white/50">Lote de Prospección</p>
          <h3 id="batchCount" class="text-2xl font-black mt-1">15 Leads</h3>
          <p id="batchDate" class="text-xs text-white/60 mt-0.5">Sincronizado hoy</p>
        </div>
        <button id="newBatchBtn" class="accent-gradient text-white text-xs font-semibold px-4 py-2.5 rounded-xl active:scale-95 transition shadow-lg shadow-[#DB1FFF]/20">
          Disparar Lote
        </button>
      </div>

      <!-- Action notice -->
      <div id="taskNotice" class="hidden bg-[#DB1FFF]/10 border border-[#DB1FFF]/30 rounded-xl p-3 text-xs text-[#DB1FFF] flex items-center gap-2">
        <span class="animate-spin text-base">⚙️</span>
        <span>Generando nuevo lote de prospectos en segundo plano...</span>
      </div>

      <!-- Leads List -->
      <div class="space-y-3">
        <h3 class="text-sm font-semibold uppercase tracking-wider text-white/60 px-1">Prospectos del Día</h3>
        <div id="leadsContainer" class="space-y-3">
          <!-- Render dinámico de leads -->
        </div>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "nexobow_system_token";
    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const tokenInput = document.getElementById("tokenInput");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const leadsContainer = document.getElementById("leadsContainer");
    const batchCount = document.getElementById("batchCount");
    const newBatchBtn = document.getElementById("newBatchBtn");
    const taskNotice = document.getElementById("taskNotice");

    function getToken() {
      return localStorage.getItem(STORAGE_KEY) || "";
    }

    function setToken(val) {
      if (val) localStorage.setItem(STORAGE_KEY, val);
      else localStorage.removeItem(STORAGE_KEY);
    }

    async function fetchLeads() {
      const token = getToken();
      try {
        const res = await fetch("/api/leads", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.status === 401) {
          showLogin();
          return;
        }
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error(err);
      }
    }

    async function triggerBatch() {
      const token = getToken();
      taskNotice.classList.remove("hidden");
      try {
        const res = await fetch("/api/batch-scout", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ mock: true, count: 15 })
        });
        if (res.ok) {
          setTimeout(fetchLeads, 4000);
        }
      } finally {
        setTimeout(() => taskNotice.classList.add("hidden"), 3000);
      }
    }

    async function updateStatus(slug, status) {
      const token = getToken();
      await fetch(`/api/leads/${slug}/status`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ status })
      });
      fetchLeads();
    }

    function renderDashboard(data) {
      loginSection.classList.add("hidden");
      dashboardSection.classList.remove("hidden");
      logoutBtn.classList.remove("hidden");

      const leads = data.leads || [];
      batchCount.innerText = `${leads.length} Leads`;
      leadsContainer.innerHTML = "";

      if (leads.length === 0) {
        leadsContainer.innerHTML = `<div class="glass rounded-xl p-6 text-center text-sm text-white/50">No hay prospectos generados aún. Tocá "Disparar Lote" para comenzar.</div>`;
        return;
      }

      leads.forEach(lead => {
        const card = document.createElement("div");
        card.className = "glass rounded-2xl p-4 space-y-3";
        const cleanPhone = String(lead.telefono || "").replace(/\D/g, "");
        const waLink = lead.whatsappOutreachLink || `https://wa.me/${cleanPhone}`;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <h4 class="font-bold text-white text-base">${lead.nombre}</h4>
              <p class="text-xs text-white/60">${lead.direccion || "Buenos Aires"}</p>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${
              lead.status === 'contactado' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-white/10 text-white/70'
            }">${lead.status || 'nuevo'}</span>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <a href="${lead.previewUrl}" target="_blank" class="flex-1 text-center py-2 px-3 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold hover:bg-white/10 text-white transition">
              👁️ Ver Demo
            </a>
            <a href="${waLink}" target="_blank" class="flex-1 text-center py-2 px-3 rounded-xl accent-gradient text-xs font-semibold text-white shadow-md active:scale-95 transition">
              💬 Abrir WhatsApp
            </a>
          </div>

          <div class="flex justify-between items-center text-[11px] text-white/40 pt-1 border-t border-white/5">
            <span>Rating: ${lead.rating || 5.0}★ (${lead.userRatingCount || 0} reseñas)</span>
            <button onclick="updateStatus('${lead.slug}', '${lead.status === 'contactado' ? 'nuevo' : 'contactado'}')" class="hover:text-white underline">
              ${lead.status === 'contactado' ? 'Marcar pendiente' : 'Marcar contactado'}
            </button>
          </div>
        `;
        leadsContainer.appendChild(card);
      });
    }

    function showLogin() {
      loginSection.classList.remove("hidden");
      dashboardSection.classList.add("hidden");
      logoutBtn.classList.add("hidden");
    }

    loginBtn.addEventListener("click", () => {
      const val = tokenInput.value.trim();
      if (!val) return;
      setToken(val);
      fetchLeads();
    });

    logoutBtn.addEventListener("click", () => {
      setToken("");
      showLogin();
    });

    newBatchBtn.addEventListener("click", triggerBatch);

    // Boot
    if (getToken()) {
      fetchLeads();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
